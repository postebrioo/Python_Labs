[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.4.0"
description = "Search engine CLI tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
findex = "findex.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0.0",
    "pyright>=1.1.0",
    "ruff>=0.1.0",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]